services:
  web:
    build:
      context: ../..
      dockerfile: sites/ai-native-engineer-io/Dockerfile
    container_name: ai-native-engineer-io
    ports:
      - "8087:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
