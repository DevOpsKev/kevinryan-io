# Minimal LibreChat config for hq.kevinryan.io (vanilla + working Anthropic).
# Without this file LibreChat v0.8.7 ships a stale default model list whose
# names (claude-3-5-sonnet-...) are retired and return 404 from the Anthropic
# API. This file declares the Anthropic endpoint with current model IDs only.
version: 1.3.13
cache: true
endpoints:
  anthropic:
    # ANTHROPIC_API_KEY is supplied via the librechat-secrets Secret.
    models:
      default: claude-sonnet-4-5-20250929
      large: claude-opus-5
      small: claude-haiku-4-5-20251001
      fetch: true
      list:
        - claude-opus-5
        - claude-sonnet-5
        - claude-fable-5
        - claude-opus-4-8
        - claude-opus-4-7
        - claude-sonnet-4-6
        - claude-opus-4-6
        - claude-opus-4-5-20251101
        - claude-haiku-4-5-20251001
        - claude-sonnet-4-5-20250929
