name: Build and Deploy Site

on:
  workflow_dispatch:
    inputs:
      site:
        description: "Site directory (under sites/) to build and deploy"
        required: true
        type: choice
        options:
          - all
          - aiimmigrants-com
          - brand-kevinryan-io
          - distributedequity-org
          - docs-kevinryan-io
          - kevinryan-io
  push:
    branches: ["main"]
    paths:
      - "sites/**"
      - "docs/**"

permissions:
  contents: write
  id-token: write

jobs:
  detect:
    name: Detect sites
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Detect changed sites
        id: detect
        run: |
          set -eu
          candidate=""

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            req="${{ inputs.site }}"
            if [ "$req" = "all" ]; then
              for d in sites/*/; do
                candidate="$candidate $(basename "$d")"
              done
            else
              candidate="$req"
            fi
          else
            before="${{ github.event.before }}"
            after="${{ github.event.after }}"
            if [ "$before" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$before" 2>/dev/null; then
              range="HEAD~1 HEAD"
            else
              range="$before $after"
            fi
            files=$(git diff --name-only $range)
            for f in $files; do
              case "$f" in
                sites/*/*) s="${f#sites/}"; s="${s%%/*}" ;;
                docs/*)    s="docs-kevinryan-io" ;;
                *)        continue ;;
              esac
              case " $candidate " in *" $s "*) ;; *) candidate="$candidate $s";; esac
            done
          fi

          # Keep only sites with a Dockerfile and a k8s deployment.yaml
          json="[" first=1
          for s in $candidate; do
            [ -n "$s" ] || continue
            if [ -f "sites/$s/Dockerfile" ] && [ -f "k8s/$s/deployment.yaml" ]; then
              if [ $first -eq 1 ]; then first=0; else json="$json,"; fi
              json="$json\"$s\""
            fi
          done
          json="$json]"
          echo "matrix=$json" >> "$GITHUB_OUTPUT"
          echo "Deploying: $json"

  deploy:
    name: Deploy ${{ matrix.site }}
    needs: detect
    if: ${{ needs.detect.outputs.matrix != '[]' && needs.detect.outputs.matrix != '' }}
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ matrix.site }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set short SHA and commit date
        id: vars
        run: |
          echo "SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "DATE=$(git show -s --date=format:'%d %b %Y' --format=%cd HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to Azure
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name "${{ secrets.ACR_NAME }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: sites/${{ matrix.site }}/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ matrix.site }}:${{ steps.vars.outputs.SHA }}
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ matrix.site }}:latest
          build-args: |
            COMMIT_SHA=${{ steps.vars.outputs.SHA }}
            COMMIT_DATE=${{ steps.vars.outputs.DATE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update image tag in Kubernetes manifest
        run: |
          sed -i "s|image: .*${{ matrix.site }}:.*|image: ${{ secrets.ACR_LOGIN_SERVER }}/${{ matrix.site }}:${{ steps.vars.outputs.SHA }}|" \
            k8s/${{ matrix.site }}/deployment.yaml

      - name: Commit and push manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/${{ matrix.site }}/deployment.yaml
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "[deploy] ${{ matrix.site }}: ${{ steps.vars.outputs.SHA }}"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i * 2))
          done
          echo "Failed to push after 5 attempts" && exit 1
