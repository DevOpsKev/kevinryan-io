---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: forgejo-runner
  namespace: flux-system
spec:
  dependsOn:
    - name: external-secrets-store
    - name: forgejo
  interval: 10m0s
  path: ./k8s/forgejo-runner
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
