apiVersion: v1
kind: ConfigMap
metadata:
  name: librechat-config
  namespace: hq-kevinryan-io
data:
  # ── Server ──
  HOST: "0.0.0.0"
  PORT: "3080"
  NODE_ENV: "production"
  # Trust the single Cloudflare → Traefik → pod hop for X-Forwarded-* handling.
  TRUST_PROXY: "1"
  NO_INDEX: "true"

  # ── Domain ──
  DOMAIN_CLIENT: "https://hq.kevinryan.io"
  DOMAIN_SERVER: "https://hq.kevinryan.io"

  # ── MongoDB (internal, unauthenticated for the vanilla install) ──
  MONGO_URI: "mongodb://librechat-mongodb.hq-kevinryan-io.svc.cluster.local:27017/LibreChat"

  # ── Search (disabled for vanilla) ──
  SEARCH: "false"
  MEILI_NO_ANALYTICS: "true"

  # ── Auth (LibreChat native email/password; Auth0 dropped) ──
  ALLOW_EMAIL_LOGIN: "true"
  # Registration closed: the initial admin account already exists.
  # Re-enable temporarily (or use the admin panel) to add users.
  ALLOW_REGISTRATION: "false"
  ALLOW_SOCIAL_LOGIN: "false"
  ALLOW_SOCIAL_REGISTRATION: "false"
  ALLOW_PASSWORD_RESET: "false"
  ALLOW_UNVERIFIED_EMAIL_LOGIN: "true"

  # ── Anthropic models (direct API; current IDs available on the key) ──
  # LibreChat v0.8.7 ships a stale default list whose names are retired and
  # 404. Override with the live model IDs from the Anthropic /v1/models API.
  ANTHROPIC_MODELS: "claude-opus-5,claude-sonnet-5,claude-fable-5,claude-opus-4-8,claude-opus-4-7,claude-sonnet-4-6,claude-opus-4-6,claude-opus-4-5-20251101,claude-haiku-4-5-20251001,claude-sonnet-4-5-20250929"
