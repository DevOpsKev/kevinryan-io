apiVersion: apps/v1
kind: Deployment
metadata:
  name: librechat
  namespace: hq-kevinryan-io
spec:
  replicas: 1
  selector:
    matchLabels:
      app: librechat
  template:
    metadata:
      labels:
        app: librechat
    spec:
      initContainers:
        - name: patch-index
          # Digest-pinned so pod restarts can never silently pull a new
          # upstream release and no-op the sed patches below. Bump
          # deliberately: check LibreChat release notes, pull the new digest
          # (docker manifest inspect), update the guards below if the
          # index.html shape changed, then bump this digest in a single
          # commit for both initContainer and container.
          image: registry.librechat.ai/danny-avila/librechat@sha256:c5db3331b845e1f289f8d04c0c77936c4bbe372f76730a804abc1c37e44d23a9
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -e
              cp /app/client/dist/index.html /theme-patch/index.html
              # Copy the hashed JS/CSS assets so the i18n string patch below
              # can be applied without touching the image. The patched copy
              # is mounted over /app/client/dist/assets (see volumeMounts).
              cp -r /app/client/dist/assets /theme-patch/assets
              # Inject the custom theme stylesheet before </head>.
              # The ?v= cache-buster defeats the service worker's stale copy so
              # CSS updates are seen without clearing browser/SW caches. The
              # value is the first 8 hex chars of sha256(custom-theme.css) —
              # derived and rewritten by scripts/sync-hq-theme.sh, never
              # bumped by hand.
              sed -i 's|</head>|<link rel="stylesheet" href="/custom-theme.css?v=538fed5f"></head>|' /theme-patch/index.html
              # Page title: replace the default 'LibreChat' with HQ branding.
              sed -i 's|<title>LibreChat</title>|<title>HQ - Kevin Ryan \& Associates</title>|' /theme-patch/index.html
              # Paint the loading screen Tokyo Night Moon and force dark.
              sed -i 's|#0d0d0d|#222436|g; s|#ffffff|#222436|g; s|#171717|#222436|g' /theme-patch/index.html
              sed -i 's|<meta name="theme-color" content="[^"]*"|<meta name="theme-color" content="#222436"|' /theme-patch/index.html
              # Force dark mode so the app never renders light surfaces.
              sed -i 's|<base href="/" />|<base href="/" /><script>try{document.documentElement.classList.add("dark");localStorage.setItem("color-theme","dark");}catch(e){}</script>|' /theme-patch/index.html

              # ── Branding: replace the login h1 i18n string (en locale) ──
              # LibreChat compiles locales into the JS bundle (no runtime
              # i18n files), so the only overlay-compatible way to change
              # com_auth_welcome_back is to sed the bundle. Real text in the
              # DOM also fixes the a11y problem: the old CSS font-size:0 hack
              # left "Welcome back" in the accessibility tree.
              WB_FILES="$(grep -rl 'com_auth_welcome_back:`Welcome back`' /theme-patch/assets || true)"
              [ -n "$WB_FILES" ] || { echo 'FATAL: welcome-back string not found in JS assets — upstream changed the locale bundle'; exit 1; }
              sed -i 's|com_auth_welcome_back:`Welcome back`|com_auth_welcome_back:`HQ`|' $WB_FILES

              # ── Bust the service-worker precache for the patched JS ──
              # The SW precaches the app JS by its query-less URL; a request
              # with ?v= bypasses the precache and fetches our patched copy.
              # The value is the sha256-8 of the patched main bundle, so it
              # changes on any upstream rebuild or patch change.
              ASSET_V="$(cd /theme-patch/assets && sha256sum index*.js 2>/dev/null | head -1 | cut -d' ' -f1 | cut -c1-8)"
              [ -n "$ASSET_V" ] || { echo 'FATAL: could not hash the JS bundle'; exit 1; }
              sed -i "s|/assets/\([A-Za-z0-9._-]*\.js\)\"|/assets/\1?v=$ASSET_V\"|g; s|/assets/\([A-Za-z0-9._-]*\.css\)\"|/assets/\1?v=$ASSET_V\"|g" /theme-patch/index.html

              # ── Post-patch guards ──
              # A sed no-op (upstream changed index.html) would otherwise
              # deploy an unthemed site silently. Fail the init container
              # instead so the rollout is loud: pod stuck in
              # Init:Error/CrashLoopBackOff, Flux shows not-ready.
              grep -q 'custom-theme.css?v=' /theme-patch/index.html || { echo 'FATAL: stylesheet injection failed — upstream index.html changed'; exit 1; }
              grep -q '<title>HQ - Kevin Ryan' /theme-patch/index.html || { echo 'FATAL: title replacement failed — upstream index.html changed'; exit 1; }
              grep -q 'classList.add' /theme-patch/index.html || { echo 'FATAL: dark-mode script injection failed — upstream index.html changed'; exit 1; }
              grep -q 'name="theme-color" content="#222436"' /theme-patch/index.html || { echo 'FATAL: theme-color replacement failed — upstream index.html changed'; exit 1; }
              if grep -q '#0d0d0d' /theme-patch/index.html; then
                echo 'FATAL: loading-screen repaint failed — upstream index.html changed'
                exit 1
              fi
              # Welcome-back patch applied to the JS bundle (real DOM text,
              # screen readers announce "HQ").
              grep -rq 'com_auth_welcome_back:`HQ`' /theme-patch/assets || { echo 'FATAL: welcome-back replacement failed'; exit 1; }
              if grep -rq 'com_auth_welcome_back:`Welcome back`' /theme-patch/assets; then
                echo 'FATAL: unpatched welcome-back string still present'
                exit 1
              fi
              # SW-precache bust applied to asset URLs.
              grep -q "?v=$ASSET_V" /theme-patch/index.html || { echo 'FATAL: asset cache-bust failed'; exit 1; }
          volumeMounts:
            - name: theme-patch
              mountPath: /theme-patch
      containers:
        - name: librechat
          # Pre-built upstream image, pulled direct — no build step.
          # Digest-pinned to the same digest as the patch-index
          # initContainer: unpinned :latest + imagePullPolicy: Always meant
          # any pod restart could pull a new upstream release and silently
          # break the theme/branding patch layer. Bump both digests together.
          # The CI deploy workflow auto-skips sites without a Dockerfile.
          image: registry.librechat.ai/danny-avila/librechat@sha256:c5db3331b845e1f289f8d04c0c77936c4bbe372f76730a804abc1c37e44d23a9
          # Digest is immutable — IfNotPresent avoids re-pulling a blob
          # that can never change.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3080
              name: http
          envFrom:
            - configMapRef:
                name: librechat-config
            - secretRef:
                name: librechat-secrets
          env:
            # Empty string removes the "LibreChat v0.8.x - Every AI for Everyone" footer.
            - name: CUSTOM_FOOTER
              value: ""
          # httpGet /health: verified on the pinned digest
          # (sha256:c5db3331…): returns 200 "OK". Readiness now reflects app
          # health, not just a bound socket. Re-verify this endpoint exists
          # (throwaway pod or live pod exec) whenever the digest is bumped.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: librechat-data
              mountPath: /app/data
            - name: librechat-uploads
              mountPath: /app/uploads
            - name: librechat-images
              mountPath: /app/client/public/images
            - name: librechat-logs
              mountPath: /app/logs
            - name: librechat-skill
              mountPath: /app/skill
            # Custom theme: patched index.html, patched JS assets,
            # custom CSS, transparent logo.
            - name: theme-patch
              mountPath: /app/client/dist/index.html
              subPath: index.html
            # Patched asset bundle (i18n welcome-back string → HQ).
            - name: theme-patch
              mountPath: /app/client/dist/assets
              subPath: assets
            - name: librechat-custom
              mountPath: /app/client/dist/custom-theme.css
              subPath: custom-theme.css
              readOnly: true
            - name: librechat-custom
              mountPath: /app/client/dist/assets/logo.svg
              subPath: logo.svg
              readOnly: true
            # kevinryan.io favicons (over the LibreChat defaults).
            - name: librechat-custom
              mountPath: /app/client/dist/assets/favicon-16x16.png
              subPath: favicon-16x16.png
              readOnly: true
            - name: librechat-custom
              mountPath: /app/client/dist/assets/favicon-32x32.png
              subPath: favicon-32x32.png
              readOnly: true
            - name: librechat-custom
              mountPath: /app/client/dist/assets/apple-touch-icon-180x180.png
              subPath: apple-touch-icon-180x180.png
              readOnly: true
      volumes:
        - name: librechat-data
          persistentVolumeClaim:
            claimName: librechat-data
        - name: librechat-uploads
          persistentVolumeClaim:
            claimName: librechat-uploads
        - name: librechat-images
          persistentVolumeClaim:
            claimName: librechat-images
        # emptyDir for vanilla: logs/skill are not persisted across restarts.
        - name: librechat-logs
          emptyDir: {}
        - name: librechat-skill
          emptyDir: {}
        # Patched index.html (populated by the patch-index initContainer).
        - name: theme-patch
          emptyDir: {}
        # Tokyo Night Moon theme CSS + transparent login logo.
        - name: librechat-custom
          configMap:
            name: librechat-custom
