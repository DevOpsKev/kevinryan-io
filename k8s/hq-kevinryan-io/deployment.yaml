apiVersion: apps/v1
kind: Deployment
metadata:
  name: librechat
  namespace: hq-kevinryan-io
spec:
  replicas: 1
  selector:
    matchLabels:
      app: librechat
  template:
    metadata:
      labels:
        app: librechat
    spec:
      # Keep LibreChat off the control-plane node (node1) to avoid memory
      # pressure on the API server. node2 is the idle worker.
      nodeSelector:
        kubernetes.io/hostname: vm-kevinryan-node2
      containers:
        - name: librechat
          # Pre-built upstream image, pulled direct — no build step.
          # The CI deploy workflow auto-skips sites without a Dockerfile.
          image: registry.librechat.ai/danny-avila/librechat:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3080
              name: http
          envFrom:
            - configMapRef:
                name: librechat-config
            - secretRef:
                name: librechat-secrets
          # tcpSocket is the safe vanilla probe: it confirms the Express server
          # is bound without depending on a specific health path. Upgrade to
          # httpGet /health once the path is verified on first rollout.
          livenessProbe:
            tcpSocket:
              port: 3080
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 3080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: librechat-data
              mountPath: /app/data
            - name: librechat-uploads
              mountPath: /app/uploads
            - name: librechat-images
              mountPath: /app/client/public/images
            - name: librechat-logs
              mountPath: /app/logs
            - name: librechat-skill
              mountPath: /app/skill
      volumes:
        - name: librechat-data
          persistentVolumeClaim:
            claimName: librechat-data
        - name: librechat-uploads
          persistentVolumeClaim:
            claimName: librechat-uploads
        - name: librechat-images
          persistentVolumeClaim:
            claimName: librechat-images
        # emptyDir for vanilla: logs/skill are not persisted across restarts.
        - name: librechat-logs
          emptyDir: {}
        - name: librechat-skill
          emptyDir: {}
