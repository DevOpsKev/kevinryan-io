apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
  namespace: forgejo
spec:
  interval: 1h
  chart:
    spec:
      chart: forgejo
      version: "16.2.1"
      sourceRef:
        kind: HelmRepository
        name: forgejo
        namespace: forgejo
      interval: 1h
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    postgresql:
      enabled: false
    postgresql-ha:
      enabled: false
    persistence:
      enabled: true
      size: 10Gi
    gitea:
      admin:
        existingSecret: forgejo-admin
      config:
        server:
          DOMAIN: git.kevinryan.io
          ROOT_URL: https://git.kevinryan.io
          HTTP_PORT: 3000
        database:
          DB_TYPE: postgres
          NAME: forgejo_db
          SSL_MODE: require
        service:
          DISABLE_REGISTRATION: true
          SHOW_REGISTRATION_BUTTON: false
        actions:
          ENABLED: true
          DEFAULT_ACTIONS_URL: github
      additionalConfigFromEnvs:
        - name: FORGEJO__DATABASE__HOST
          valueFrom:
            secretKeyRef:
              name: forgejo-db
              key: db_host
        - name: FORGEJO__DATABASE__USER
          valueFrom:
            secretKeyRef:
              name: forgejo-db
              key: db_user
        - name: FORGEJO__DATABASE__PASSWD
          valueFrom:
            secretKeyRef:
              name: forgejo-db
              key: db_password
